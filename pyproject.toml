[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashionlenet"
version = "1.0.0"
description = "Fashion-MNIST LeNet software-to-RTL output-stationary accelerator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
train = ["torch>=2.2"]
figures = ["cairosvg>=2.7"]
notebooks = ["pandas>=2.0", "ipykernel>=6"]

[project.scripts]
fashionlenet = "fashionlenet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
